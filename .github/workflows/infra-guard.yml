name: Infrastructure Guard

on:
  push:
    branches: [main, cleanup/neon-r2-only]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify current infrastructure references
        run: node scripts/assert-current-infra.mjs
