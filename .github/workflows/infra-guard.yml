name: Infrastructure Guard

on:
  pull_request:
    branches: [main]

# Untrusted PR jobs never need repository write or OIDC credentials.
permissions:
  contents: read

concurrency:
  group: infra-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify current infrastructure references
        run: node scripts/assert-current-infra.mjs

      - name: Verify workflow's required safety checks
        run: node scripts/check-ci-workflow.mjs

  # TSU-M1-004: test the actual default branch, not the proposed PR changes.
  # Keep checks separate so a failure has an unambiguous log and status.
  baseline-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Check out current default branch
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Record source and runtime versions
        shell: bash
        run: |
          mkdir -p verification-logs
          {
            echo "Task: TSU-M1-004"
            echo "Branch: $(git branch --show-current)"
            echo "Commit: $(git rev-parse HEAD)"
            echo "Node: $(node --version)"
            echo "npm: $(npm --version)"
            echo "UTC: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } | tee verification-logs/source.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install locked dependencies
        shell: bash
        run: |
          set -o pipefail
          npm ci 2>&1 | tee verification-logs/npm-ci.log

      - name: Verify infrastructure
        shell: bash
        run: |
          set -o pipefail
          npm run verify:infra 2>&1 | tee verification-logs/verify-infra.log

      - name: Check types without emitting files
        shell: bash
        run: |
          set -o pipefail
          ./node_modules/.bin/tsc --noEmit 2>&1 | tee verification-logs/typecheck.log

      - name: Build for production
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee verification-logs/production-build.log

      - name: Retain verification logs even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tsu-m1-004-default-branch-build-${{ github.run_id }}
          path: verification-logs/
          if-no-files-found: warn
          retention-days: 14

  # TSU-M1-005: unlike baseline-build, this checks the proposed PR merge.
  # A TypeScript failure must fail both this explicit check and next build.
  candidate-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Check out proposed changes
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Record candidate source
        shell: bash
        run: |
          mkdir -p candidate-verification-logs
          {
            echo "Task: TSU-M1-005"
            echo "Commit: $(git rev-parse HEAD)"
            echo "UTC: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } | tee candidate-verification-logs/source.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install locked dependencies
        shell: bash
        run: |
          set -o pipefail
          npm ci 2>&1 | tee candidate-verification-logs/npm-ci.log

      - name: Verify the PR workflow itself
        shell: bash
        run: |
          set -o pipefail
          npm run ci:check 2>&1 | tee candidate-verification-logs/ci-policy.log

      - name: Report high/critical production dependency advisories
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm audit --omit=dev --audit-level=high 2>&1 | tee candidate-verification-logs/npm-audit-high.log

      - name: Block critical production dependency advisories
        shell: bash
        run: |
          set -o pipefail
          npm audit --omit=dev --audit-level=critical 2>&1 | tee candidate-verification-logs/npm-audit-critical.log

      - name: Verify infrastructure
        shell: bash
        run: |
          set -o pipefail
          npm run verify:infra 2>&1 | tee candidate-verification-logs/verify-infra.log

      - name: Check changed-file whitespace and patch formatting
        shell: bash
        run: |
          set -o pipefail
          git fetch origin main
          BASE="$(git merge-base HEAD origin/main)"
          git diff --check "$BASE"...HEAD 2>&1 | tee candidate-verification-logs/format-check.log
          npm run format:check -- "$BASE" 2>&1 | tee candidate-verification-logs/format-content.log

      - name: Gate critical security regressions
        shell: bash
        run: |
          set -o pipefail
          npm run verify:security 2>&1 | tee candidate-verification-logs/security-check.log

      - name: Lint source tree
        shell: bash
        run: |
          set -o pipefail
          npm run lint 2>&1 | tee candidate-verification-logs/lint.log

      - name: Verify ordered migration manifest without production DB
        shell: bash
        run: |
          set -o pipefail
          npm run migrations:check 2>&1 | tee candidate-verification-logs/migration-plan.log

      - name: Run repository regression tests
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee candidate-verification-logs/tests.log

      - name: Test admin authentication, product mutations and API error redaction in isolation
        shell: bash
        run: |
          set -o pipefail
          node --experimental-strip-types --experimental-loader ./tests/fixtures/admin-route-loader.mjs --test tests/route-authorization.integration.mjs tests/api-error-privacy.integration.mjs tests/admin-authentication.integration.mjs tests/product-mutations.integration.mjs 2>&1 | tee candidate-verification-logs/admin-route-integration.log

      - name: Check types without emitting files
        shell: bash
        run: |
          set -o pipefail
          ./node_modules/.bin/tsc --noEmit 2>&1 | tee candidate-verification-logs/typecheck.log

      - name: Build for production with TypeScript errors enforced
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee candidate-verification-logs/production-build.log

      - name: Retain candidate verification logs even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tsu-m1-005-candidate-build-${{ github.run_id }}
          path: candidate-verification-logs/
          if-no-files-found: warn
          retention-days: 14

  # Runs only against the proposed branch/PR merge and never accesses live
  # provider secrets. Payment endpoints in these browser cases are mocked.
  browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: candidate-build
    permissions:
      contents: read
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_UNDER_CONSTRUCTION: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Install pinned Playwright Chromium browser and system dependencies
        run: npx playwright install --with-deps chromium
      - name: Exercise cart/mobile checkout with mocked providers
        run: npm run test:e2e
      - name: Keep failed screenshots, traces, and test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tsuya-browser-e2e-${{ github.run_id }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 14
