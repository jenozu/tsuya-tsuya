name: Admin audit fix

on:
  push:
    branches:
      - audit/admin-images

permissions:
  contents: write

jobs:
  fix-and-build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/admin-images
          fetch-depth: 1

      - name: Apply audited fixes
        run: python3 scripts/apply-admin-audit-fixes.py

      - name: Normalize image component references and remove audit machinery
        run: |
          rm scripts/apply-admin-audit-fixes.py
          rm .github/workflows/admin-audit-fix.yml
          sed -i 's/<Image/<SafeProductImage/g' components/product-card.tsx components/cart-drawer.tsx app/cart/page.tsx app/checkout/page.tsx app/shop/\[slug\]/product-detail-client.tsx
          sed -i 's/[[:space:]]\+$//' components/product-card.tsx

      - name: Install dependencies and repair lockfile
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Verify patch cleanliness
        run: git diff --check

      - name: Commit verified fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix admin product and image pipeline"
          git push origin audit/admin-images
