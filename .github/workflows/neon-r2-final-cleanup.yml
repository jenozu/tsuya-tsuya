name: Neon R2 final cleanup

on:
  push:
    branches:
      - feat/neon-r2

permissions:
  contents: write

jobs:
  clean-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/neon-r2
          fetch-depth: 1

      - name: Update admin storage terminology
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/admin/admin-client.tsx')
          text = p.read_text()
          old = 'Shipping rates are managed through Supabase. Visit your Supabase dashboard to add or modify rates.'
          new = "Shipping rates are stored in Neon PostgreSQL. Update them through the app's database tooling or the Neon SQL Editor."
          if old not in text:
              raise SystemExit('Expected legacy admin shipping text not found')
          p.write_text(text.replace(old, new))
          PY

      - name: Remove temporary workflow
        run: rm .github/workflows/neon-r2-final-cleanup.yml

      - name: Assert no Supabase runtime references
        run: |
          if grep -R -n -i 'supabase' app lib services --include='*.ts' --include='*.tsx' --include='*.js'; then
            echo 'Unexpected Supabase reference remains in runtime source'
            exit 1
          fi

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Diff check
        run: git diff --check

      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finish Neon and R2 admin cleanup"
          git push origin feat/neon-r2
