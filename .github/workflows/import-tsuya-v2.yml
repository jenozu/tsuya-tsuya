name: Import tsuya-v2 snapshot

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  import:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out target repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Clone source repo
        run: git clone --depth 1 https://github.com/jenozu/tsuya-v2.git /tmp/tsuya-v2

      - name: Replace target files with tsuya-v2 snapshot
        shell: bash
        run: |
          rsync -a --delete --exclude='.git/' /tmp/tsuya-v2/ ./
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Clone tsuya-v2 app into tsuya-tsuya"
          git push origin main
