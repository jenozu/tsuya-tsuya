name: Temporary ESLint lockfile generation
on:
  push:
    branches: [ci/repair-next-lint]

permissions:
  contents: write

jobs:
  generate-lockfile:
    if: github.repository == 'jenozu/tsuya-tsuya'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate lockfile without running dependency scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile to this exact branch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          if git diff --cached --quiet; then
            echo 'package-lock.json already in sync'
            exit 0
          fi
          git commit -m 'chore: lock ESLint dependencies'
          git push origin HEAD:ci/repair-next-lint
